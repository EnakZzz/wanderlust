name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "apps/mobile/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/android-signing.ps1"
      - "scripts/build-android-apk.ps1"
      - "scripts/deploy-config.ps1"
      - "scripts/verify-android-apk.ps1"
      - "scripts/verify-store-readiness.ps1"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Restore Android upload keystore
        shell: pwsh
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $missing = @()
          foreach ($name in @(
            "ANDROID_UPLOAD_KEYSTORE_BASE64",
            "ANDROID_UPLOAD_STORE_PASSWORD",
            "ANDROID_UPLOAD_KEY_ALIAS",
            "ANDROID_UPLOAD_KEY_PASSWORD"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            foreach ($name in $missing) {
              Write-Output "::error::Missing required GitHub secret: $name"
            }
            exit 1
          }

          $keystore = Join-Path $PWD ".local/android/wanderlust-upload.keystore"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $keystore) | Out-Null
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_UPLOAD_KEYSTORE_BASE64))

          "WANDERLUST_ANDROID_UPLOAD_STORE_FILE=$($keystore.Replace('\', '/'))" >> $env:GITHUB_ENV
          "WANDERLUST_ANDROID_UPLOAD_STORE_PASSWORD=$env:ANDROID_UPLOAD_STORE_PASSWORD" >> $env:GITHUB_ENV
          "WANDERLUST_ANDROID_UPLOAD_KEY_ALIAS=$env:ANDROID_UPLOAD_KEY_ALIAS" >> $env:GITHUB_ENV
          "WANDERLUST_ANDROID_UPLOAD_KEY_PASSWORD=$env:ANDROID_UPLOAD_KEY_PASSWORD" >> $env:GITHUB_ENV

      - name: Build release APK
        shell: pwsh
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
          MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
        run: ./scripts/build-android-apk.ps1

      - name: Upload APK artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: wanderlust-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android latest release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SOURCE: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          RELEASE_TAG: android-latest
          RELEASE_APK_NAME: wanderlust-release.apk
          RELEASE_QR_NAME: wanderlust-release-qr.png
        run: |
          set -euo pipefail

          mkdir -p artifacts/android-release-notes
          cp "$APK_SOURCE" "artifacts/android-release-notes/$RELEASE_APK_NAME"

          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_APK_NAME}"
          qr_path="artifacts/android-release-notes/$RELEASE_QR_NAME"
          npx --yes qrcode -o "$qr_path" -w 512 "$apk_url"

          notes_path="artifacts/android-release-notes/release-notes.md"
          cat > "$notes_path" <<EOF
          ## Android APK

          - Commit: \`${GITHUB_SHA}\`
          - APK: [${RELEASE_APK_NAME}](${apk_url})
          - GitHub Actions run: [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ### Scan to install

          ![Scan to download Android APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_QR_NAME})
          EOF

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "$RELEASE_TAG"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Android latest APK" \
              --notes-file "$notes_path" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --title "Android latest APK" \
              --notes-file "$notes_path" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$RELEASE_TAG" \
            "artifacts/android-release-notes/$RELEASE_APK_NAME" \
            "artifacts/android-release-notes/$RELEASE_QR_NAME" \
            --clobber

          {
            echo "## Android APK"
            echo
            echo "- Release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "- APK: ${apk_url}"
            echo
            echo "![Scan to download Android APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_QR_NAME})"
          } >> "$GITHUB_STEP_SUMMARY"
